#IPV6
default-lease-time 86400;
max-lease-time 86400;
log-facility local7;
authoritative;
use-host-decl-names on;

option ipv6-address code 214 = ip6-address;
option ipv6-netmask code 215 = unsigned integer 8;
option ipv6-gateway code 216 = ip6-address;

#####################DHCP GPON #####################################

#pool 1 DHCP IPV6 vlan 69
subnet6 2001:db8:acad:69::/64 {
        range6 2001:0db8:acad:0069:0000:0000:0000:0001 2001:0db8:acad:0069:0000:0000:0000:0100;
        range6 2001:0db8:acad:0069:0000:0000:0000:0000/64 temporary;
        prefix6 2001:0db8:acad:0069:0000:0000:0000:0000 2001:0db8:acad:0070:0000:0000:0000:0000 /64;	
        option dhcp6.name-servers 2001:4860:4860::8888, 2001:4860:4860::8844, 2606:4700:4700::1111, 2606:4700:4700::1001;
}

#pool 2 DHCP IPV6 vlan 100
subnet6 2001:db8:acad:100::/64 {
        range6 2001:0db8:acad:0100:0000:0000:0000:0001 2001:0db8:acad:0100:0000:0000:0000:0100;
        range6 2001:0db8:acad:0100:0000:0000:0000:0000/64 temporary;
        prefix6 2001:0db8:acad:0100:0000:0000:0000:0000 2001:0db8:acad:0101:0000:0000:0000:0000 /64;
        option dhcp6.name-servers 2001:4860:4860::8888, 2001:4860:4860::8844, 2606:4700:4700::1111, 2606:4700:4700::1001;
}


#pool 3 DHCP IPV6 vlan 200
subnet6 2001:db8:acad:0200::/60 {
        range6 2001:0db8:acad:0200:0000:0000:0000:0001 2001:0db8:acad:0200:0000:0000:0000:ffff;
	prefix6 2001:0db8:acad:0200:0000:0000:0000:0000 2001:0db8:acad:020f:0000:0000:0000:0000 /64;
	option dhcp6.name-servers 2001:4860:4860::8888, 2001:4860:4860::8844, 2606:4700:4700::1111, 2606:4700:4700::1001;
	#option dhcp6.ndra-router-lifetime 1800;
	#option dhcp6.ndra-lifetime 1800;
	#option ipv6-gateway 2001:0db8:acad:0200:0000:0000:0000:0002;
}


#pool 4 DHCP IPV6 vlan 300
subnet6 2001:db8:acad:300::/64 {
        range6 2001:0db8:acad:0300:0000:0000:0000:0001 2001:0db8:acad:0300:0000:0000:0000:0100;
        range6 2001:0db8:acad:0300:0000:0000:0000:0000/64 temporary;
        prefix6 2001:0db8:acad:0300:0000:0000:0000:0000 2001:0db8:acad:0301:0000:0000:0000:0000 /64;
        option dhcp6.name-servers 2001:4860:4860::8888, 2001:4860:4860::8844, 2606:4700:4700::1111, 2606:4700:4700::1001;
}


#pool 5 DHCP IPV6 vlan 400
subnet6 2001:db8:acad:400::/64 {
        range6 2001:0db8:acad:0400:0000:0000:0000:0001 2001:0db8:acad:0400:0000:0000:0000:0100;
        range6 2001:0db8:acad:0400:0000:0000:0000:0000/64 temporary;        
        prefix6 2001:0db8:acad:0400:0000:0000:0000:0000 2001:0db8:acad:0401:0000:0000:0000:0000 /64;
        option dhcp6.name-servers 2001:4860:4860::8888, 2001:4860:4860::8844, 2606:4700:4700::1111, 2606:4700:4700::1001;
}

