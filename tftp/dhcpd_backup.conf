        #max-lease-time 72000;

        }

# Assignment for the B Wing (VLAN 200 DATA)
subnet 10.2.0.0 netmask 255.255.255.0 {

        range                           10.2.0.3 10.2.0.254;
        option routers                  10.2.0.253;
        option subnet-mask              255.255.255.0;
        option broadcast-address        10.2.0.255;
        option domain-name-servers      8.8.8.8,8.8.4.4,200.13.249.101;
        #default-lease-time 36000;
        #max-lease-time 72000;

        }

# Assignment for the C Wing (VLAN 300 IPTV)
subnet 10.3.0.0 netmask 255.255.255.0 {

        range                           10.3.0.3 10.3.0.254;
        option routers                  10.3.0.253;
        option subnet-mask              255.255.255.0;
        option broadcast-address        10.3.0.255;
        option domain-name-servers      10.3.0.1;
        #default-lease-time 3600;
        #max-lease-time 7200;

        #Rutas staticas IPTV alcanza dominio sagem.iptv.sagem.lab
        option rfc3442-classless-static-routes 32, 192, 168, 35, 8, 10 ,3, 0, 253, 32, 192, 168, 35, 16, 10, 3, 0, 253, 32, 192, 168, 35, 17, 10, 3, 0, 253;

        }

# Assignment for the C Wing (VLAN 400 TOIP)
subnet 10.4.0.0 netmask 255.255.255.0 {

        range                           10.4.0.3 10.4.0.254;
        option routers                  10.4.0.253;
        option subnet-mask              255.255.255.0;
        option broadcast-address        10.4.0.255;
        option domain-name-servers      10.4.0.1;

        #default-lease-time 3600;
        #max-lease-time 7200;
        
        #Rutas estaticas a sip serve sagem.sip.sagem.lab
        #option rfc3442-classless-static-routes 32, 192, 168, 35, 10, 10 ,4, 0, 1;

        }


# Assignment for the B Wing (VLAN 69)
subnet 10.5.0.0 netmask 255.255.255.0 {

        range                           10.5.0.2 10.5.0.7;
        option routers                  10.5.0.253;
        option subnet-mask              255.255.255.0;
        option broadcast-address        10.5.0.255;
        option domain-name-servers      10.5.0.1;

        #default-lease-time 3600;
        #max-lease-time 7200;
        #Rutas estaticas

        #http://192.168.35.9:9034/TR069ACS
        #option vendor-encapsulated-options 01:21:68:74:74:70:3a:2f:2f:31:39:32:2e:31:36:38:2e:33:35:2e:39:3a:39:30:33:34:2f:54:52:30:36:39:41:43:53;

        #http://192.168.35.200:9034/TR069ACS
        #option vendor-encapsulated-options 01:23:68:74:74:70:3a:2f:2f:31:39:32:2e:31:36:38:2e:33:35:2e:32:30:30:3a:39:30:33:34:2f:54:52:30:36:39:41:43:53;

        #http://192.168.35.100:9034/TR069ACS
        #option vendor-encapsulated-options 01:23:68:74:74:70:3a:2f:2f:31:39:32:2e:31:36:38:2e:33:35:2e:31:30:30:3a:39:30:33:34:2f:54:52:30:36:39:41:43:53;

        #XMPP sagem.xmpp.sagem.lab   servidor openfire ip 192.168.35.100

        #http://sagem.acs.sagem.lab:9034/TR069ACS
        option vendor-encapsulated-options 01:28:68:74:74:70:3A:2F:2F:73:61:67:65:6D:2E:61:63:73:2E:73:61:67:65:6D:2E:6C:61:62:3A:39:30:33:34:2F:54:52:30:36:39:41:43:53;

        #ACS PC Python http://sagem.acs2.sagem.lab:9034/TR069ACS
        #option vendor-encapsulated-options 01:29:68:74:74:70:3A:2F:2F:73:61:67:65:6D:2E:61:63:73:32:2E:73:61:67:65:6D:2E:6C:61:62:3A:39:30:33:34:2F:54:52:30:36:39:41:43:53;


        #Rutas estaticas
        #option rfc3442-classless-static-routes 32, 192, 168, 35, 9, 10 ,5, 0, 1, 32, 192, 168, 35, 100, 10, 5, 0, 1, 32, 192, 168, 35, 200, 10, 5, 0, 1;
        option rfc3442-classless-static-routes 32, 192, 168, 35, 4, 10 ,5, 0, 253 ;
	#default-lease-time 36000;
        #max-lease-time 72000;

        }


#GRE
subnet 192.168.88.0 netmask 255.255.255.0 {
        range                           192.168.88.2 192.168.88.100;
        option routers                  192.168.88.1;
        option subnet-mask              255.255.255.0;
        option broadcast-address        192.168.88.255;
        option domain-name-servers      8.8.8.8;
	}

############################################################################# DOCSIS #####################################################################

option domain-name "lab.net";
#option domain-name-servers 10.0.0.150;
ddns-update-style none;
next-server 10.0.0.150;


option space PacketCable;
        option PacketCable.dhcp-server-1 code 1 = ip-address;
        option PacketCable code 122 = encapsulate PacketCable;
        option PacketCable.kerberos-real-name code 6 = string;
        option PacketCable.prov-server code 3 = string;
        option packetcable.kerberos-realm-name code 6 = string;
        option packetcable.kerberos-get-tgt code 7 = boolean;

class "none" {
	match if substring (option vendor-class-identifier, 0 ,1) = "none"; 
}

shared-network mysharedne {

subnet 10.0.0.0 netmask 255.255.255.0 {

pool {
	allow members of "none";
        range dynamic-bootp 10.0.0.20  10.0.0.21;
        option broadcast-address 192.168.3.255;
        option routers 10.0.0.254;
        option subnet-mask 255.255.255.0;
        option domain-name-servers 8.8.8.8, 8.8.4.4;

}
}

# Interface CM
class "docsis" {
	match if substring (option vendor-class-identifier, 0, 6) = "docsis";
}


subnet 172.16.6.0 netmask 255.255.255.0 {
pool {
	allow members of "docsis";
        range dynamic-bootp 172.16.6.2 172.16.6.7;
        option broadcast-address 172.16.6.255;
        option routers 172.16.6.1;
        option subnet-mask 255.255.255.0;
        option domain-name-servers 8.8.8.8, 8.8.4.4;
        option tftp-server-name "10.0.0.150";
        option bootfile-name "basico.cfg";
        server-name "10.0.0.150";
        filename "basico.cfg";
        option time-servers 10.0.0.252;
        option time-offset -6;
        #option dhcp-renewal-time 65535;
        option log-servers 10.0.0.150;
        option PacketCable.dhcp-server-1 10.0.0.150;
	ping-check true;

        #host IZZI {
        #hardware ethernet 64:fd:96:52:f1:d7;
        #fixed-address 10.51.0.2;
        #filename "basicoSIP_izzi.cfg";
        #option dhcp-parameter-request-list 2,3,4,7,58,122;
        #option vendor-class-identifier "DHCP-server";
        #}

#        host Sagem3686_Colom {
#        hardware ethernet 94:3c:96:44:69:40;
#        fixed-address 10.51.0.3;
#        filename "sagemcom_bsod.cfg";
#        option dhcp-parameter-request-list 2,3,4,7,58,122;
#        option vendor-class-identifier "DHCP-server";
#        }

	
}
} 

#Interface RG
class "WAN1" {
	match if substring (option vendor-class-identifier, 0, 7) = "eRouter";
}

subnet 172.16.7.0 netmask 255.255.255.0 {
pool {
       allow members of "WAN1";
       range dynamic-bootp 172.16.7.2  172.16.7.99;
       option broadcast-address 172.16.7.255;
       option routers 172.16.7.1;
       option subnet-mask 255.255.255.0;
       option domain-name-servers 192.168.35.9,8.8.8.8,8.8.4.4;

#	host CGNV5{
#	hardware ethernet bc:3e:07:5c:25:73;
#	fixed-address 172.51.0.10;
#	}

#	host CGNV5-1CM{
#	hardware ethernet 84:0b:7c:55:c1:91;
#	fixed-address 172.51.0.20;
#	}
	
}

# Pool para los que NO son eRouter
    pool {
        deny members of "WAN1";
        range dynamic-bootp 172.16.7.101 172.16.7.250;
        option broadcast-address 172.16.7.255;
        option routers 172.16.7.1;
        option subnet-mask 255.255.255.0;
        option domain-name-servers 192.168.35.9,8.8.8.8,8.8.4.4;
    }

}

#Interface EMTA
class "EMTA"{
match if substring (option vendor-class-identifier, 0, 4) = "pktc";
}

subnet 172.16.8.0 netmask 255.255.255.0 {

pool {
	allow members of "EMTA";
        range dynamic-bootp 172.16.8.2 172.16.8.7;
        option broadcast-address 172.16.8.255;
        option routers 172.16.8.1;
        option subnet-mask 255.255.255.0;
        option domain-name-servers 10.0.0.150;
        option host-name "emta.bin";
        option tftp-server-name "10.0.0.150";
        option bootfile-name "emta.bin";
        option PacketCable.prov-server 00:03:6c:61:62:03:6e:65:74:00;
        option PacketCable.kerberos-real-name "\005BASIC\0011\000";
	#option PacketCable.kerberos-real-name "\006HYBRID\0012\000";
        option time-servers 10.0.0.252;
        option time-offset 0;
        option log-servers 10.0.0.150;
        option domain-name "lab.net";
	filename "emta.bin";

	host Sag3890-EMTA-2{
	hardware ethernet 5C:FA:25:B1:EF:FD;
        fixed-address 172.16.8.2;
        filename "NCS_toip.bin";
        }

	host Sag3686-EMTA-1{
        hardware ethernet 44:15:24:29:64:23;
        fixed-address 172.16.8.5;
        filename "NCS_toip.bin";
        }

        host Sag3890-EMTA-3{
        hardware ethernet 7c:d4:a8:af:97:63;
        fixed-address 172.16.8.4;
        filename "NCS_toip.bin";
        }


	default-lease-time 43200;
	max-lease-time 43200;

}
}



}
