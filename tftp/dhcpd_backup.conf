# dhcpd.conf

default-lease-time 1800;
max-lease-time 1800;
ddns-update-style none;
authoritative;
log-facility local7;

########################################################################### GPON#############################################################
option rfc3442-classless-static-routes code 121 = array of integer 8;

# Assignment for the A Wing (VLAN 100 MNGT)
subnet 10.1.0.0 netmask 255.255.255.0 {
        range                           10.1.0.3 10.1.0.7;
        option routers                  10.1.0.253;
        option subnet-mask              255.255.255.0;
        option broadcast-address        10.1.0.255;
        option domain-name-servers      10.1.0.1;

        #http://192.168.35.9:9034/TR069ACS       
        #option vendor-encapsulated-options 01:21:68:74:74:70:3a:2f:2f:31:39:32:2e:31:36:38:2e:33:35:2e:39:3a:39:30:33:34:2f:54:52:30:36:39:41:43:53;

        #http://192.168.35.200:9034/TR069ACS
